name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ vars.NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY }}
          # preview-start (scripts/go-live.sh removes this block at the domain cutover)
          # Builds for https://nradachy-web.github.io/jakes-car-detailing/. The
          # base path also keeps the preview out of search (layout.tsx, robots.ts).
          NEXT_PUBLIC_BASE_PATH: "/jakes-car-detailing"
          # Lets a texted preview link unfurl with the share image.
          NEXT_PUBLIC_SHARE_ORIGIN: "https://nradachy-web.github.io/jakes-car-detailing"
          # preview-end

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
